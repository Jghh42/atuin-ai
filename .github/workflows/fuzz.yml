name: Nightly bounded fuzzing
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/atuin
            target: FuzzDecode
          - package: ./internal/tools
            target: FuzzValidateBatch
          - package: ./internal/safety
            target: FuzzEscalate
          - package: ./internal/provider/codex
            target: FuzzResponsesSSE
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: go test '${{ matrix.package }}' -run='^$' -fuzz='${{ matrix.target }}' -fuzztime=2m -parallel=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: internal/**/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 7
